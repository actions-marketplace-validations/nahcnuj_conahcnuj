name: 'conahcnuj'
description: >
  Marketplace entrypoint for the conahcnuj repository. The actual functionality
  is provided by the reusable workflows under .github/workflows/ (issue-driver.yml
  and owner-approved-auto-merge.yml), consumed via
  `uses: nahcnuj/conahcnuj/.github/workflows/<name>.yml@<ref>`. This composite
  action exists to satisfy the GitHub Marketplace publishing requirement that a
  repository expose an action.yml at its root; it does not run the driver itself.
author: 'nahcnuj'

branding:
  icon: 'terminal'
  color: 'blue'

runs:
  using: composite
  steps:
    - name: conahcnuj
      shell: bash
      run: |
        echo "conahcnuj is published to the GitHub Marketplace as an entrypoint."
        echo "Use the reusable workflows under .github/workflows/ to drive issues or auto-merge PRs."
        echo "See the repository README and docs/workflows.md for usage."
