name: Install opencode
description: >
  Install the opencode v2 CLI (the release line this repository targets).
  Adds the opencode and conahcnuj bin dirs to PATH. Requires a prior
  actions/checkout step so the action can be referenced as ./.github/actions/install-opencode.

runs:
  using: composite
  steps:
    - name: Install opencode
      shell: bash
      run: |
        curl -fsSL https://opencode.ai/install | bash
        echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
